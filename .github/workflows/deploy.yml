name: Deploy to Vercel

# Push / merge to feat/aava-3-prototype → production
# Open / update a PR into that branch → preview
on:
  push:
    branches: [feat/aava-3-prototype]
  pull_request:
    branches: [feat/aava-3-prototype]

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Avoid leaking token via CLI process args; env auth is enough.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel pull --yes --environment=production
          else
            vercel pull --yes --environment=preview
          fi

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel build --prod
          else
            vercel build
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            url=$(vercel deploy --prebuilt --prod)
          else
            url=$(vercel deploy --prebuilt)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Summary
        run: |
          {
            echo "## Vercel deployment"
            echo ""
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "- **Target:** production"
              echo "- **Alias:** https://aava-3-0.vercel.app"
            else
              echo "- **Target:** preview"
            fi
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
